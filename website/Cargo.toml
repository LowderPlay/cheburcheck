[package]
name = "website"
version = "1.4.6"
edition = "2024"

[dependencies]
anyhow = "1.0"
semver = "1.0"
rocket = { version = "0.5.1", features = ["msgpack", "json"] }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "migrate", "chrono", "uuid"] }
klickhouse = { version = "0.15.3", default-features = false, features = ["compression", "derive", "refinery"] }
refinery = { version = "0.9.2", default-features = false }
rocket-client-addr = "0.5.4"
serde = { workspace = true }
reports = { path = "../reports" }
querying = { path = "../querying" }
env_logger = "0.11.10"
rocket-cache-response = "0.6.4"
log = { workspace = true }
dotenvy = { version = "0.15.7" }
governor = { version = "0.6", features = ["dashmap"] }
rumqttc = "0.24"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true }
rand = "0.10.3"
url = "2"
percent-encoding = "2"
