[package]
name = "probe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.0", features = ["derive", "env"] }
env_logger = "0.11.10"
futures = "0.3"
log = { workspace = true }
rumqttc = { version = "0.24", features = ["websocket"] }
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
reports = { path = "../reports" }
rustls = "0.23"
tokio-rustls = "0.26"
