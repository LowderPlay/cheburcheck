services:
  nginx:
    image: docker.io/nginx:1.27-alpine
    depends_on:
      - frontend
      - website
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    environment:
      ROCKET_ADDRESS: "::"
      ROCKET_PORT: 8000
      DATABASE_URL: "${DATABASE_URL}"
    expose:
      - "8000"
