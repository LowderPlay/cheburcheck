services:
  nginx:
    image: docker.io/nginx:1.27-alpine
    depends_on:
      - frontend
      - website
      - rmqtt
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    environment:
      ROCKET_ADDRESS: "::"
      ROCKET_PORT: 8000
      DATABASE_URL: "${DATABASE_URL}"
      MQTT_ADMIN_TOKEN: "${MQTT_ADMIN_TOKEN}"
      MQTT_HOST: rmqtt
      MQTT_PORT: 11883
    expose:
      - "8000"

  rmqtt:
    image: docker.io/rmqtt/rmqtt:latest
    depends_on:
      - website
    volumes:
      - ./rmqtt/rmqtt.toml:/app/rmqtt/rmqtt.toml:ro
      - ./rmqtt/rmqtt-plugins:/app/rmqtt/rmqtt-plugins:ro
    expose:
      - "8080"
      - "1883"
      - "11883"
      - "6060"

volumes:
  rmqtt-data:
